<html lang="en">

<style>
* {

body {

}

header {
    background: #222;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #ffb703;
}

header button {
    background: #e63946;

    padding: 10px 20px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

/* Dashboard */
.container {
    padding: 30px 5%;
}

.container h1 {
    margin-bottom: 25px;
    color: #222;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px #ccc;
    text-align: center;
}

.card h3 {
    color: #555;
    margin-bottom: 15px;
}

.card p {
    font-size: 30px;
    font-weight: bold;
    color: #e09f3e;
}

/* Reservation Section */
.reservation-section {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px #ccc;
}

.reservation-section h2 {
    margin-bottom: 20px;
}

.search {
    padding: 12px;
    width: 100%;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #222;
    color: white;
}

tr:hover {
    background: #f5f5f5;
}

/* Buttons */
button {
    cursor: pointer;
}

.confirm {
    background: #28a745;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 4px;
}

.cancel {
    background: #e63946;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 4px;
}

.delete {
    background: #555;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 4px;
}

.status {
    font-weight: bold;
}

.status.Pending {
    color: #e09f3e;
}

.status.Confirmed {
    color: green;
}

.status.Cancelled {
    color: red;
}

.table-wrapper {
    overflow-x: auto;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 18px;
    margin-top: 40px;
}

@media(max-width: 800px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 500px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
