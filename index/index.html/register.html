<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Giridhar Restaurant</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #21140e;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
        }

        .register-box h1 {
            color: #a84300;
            text-align: center;
            margin-bottom: 8px;
        }

        .register-box p {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }

        .register-box label {
            display: block;
            margin: 12px 0 6px;
            color: #333;
            font-weight: bold;
        }

        .register-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .register-box button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #a84300;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-box button:hover {
            background: #702c00;
        }

        .register-box .show-password {
            width: auto;
        }

        .register-box .links {
            margin-top: 20px;
            text-align: center;
        }

        .register-box a {
            color: #a84300;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>Giridhar Restaurant</h1>
    <p>Create Your Account</p>

    <form id="registerForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="phone">Mobile Number</label>
        <input type="tel" id="phone" placeholder="Enter 10-digit mobile number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create password"
               minlength="6" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm password" required>

        <label>
            <input type="checkbox" class="show-password" id="showPassword">
            Show Password
        </label>

        <label>
            <input type="checkbox" id="terms" required>
            I agree to the Terms and Conditions.
        </label>

        <button type="submit">Create Account</button>

        <div id="message"></div>

    </form>

    <div class="links">
        Already have an account?
        <a href="login.html">Login</a>
        <br><br>
        <a href="../index.html">← Back to Home</a>
    </div>

</div>

<script src="../js/script.js"></script>

<script>
    document.getElementById("showPassword").addEventListener("change", function() {
        const type = this.checked ? "text" : "password";
        document.getElementById("password").type = type;
        document.getElementById("confirmPassword").type = type;
    });

    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const message = document.getElementById("message");

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match!";
            return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            message.style.color = "red";
            message.textContent = "Enter a valid mobile number!";
            return;
        }

        // Demo only: never store passwords in localStorage.
        localStorage.setItem("giridharCustomer", JSON.stringify({
            name: name,
            email: email,
            phone: phone
        }));

        message.style.color = "green";
        message.textContent = "Registration successful! Redirecting to login...";

        setTimeout(function() {
            window.location.href = "login.html";
        }, 1500);
    });
</script>

</body>
</html>
